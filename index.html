<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কঠিন চীবর দান — Kathina Chibor Dan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Cormorant+Garamond:wght@500;700&display=swap">
<style>
:root{--bg:#fbf3e2;--ink:#4a1414;--soft:#8a5a3c;--gold:#c9821a;--card:#fff9ec;--line:#e6cfa3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d0d;--ink:#fbe9c8;--soft:#d9b07a;--gold:#f0a82e;--card:#3a1414;--line:#6b3a22}}
:root[data-theme="dark"]{--bg:#2a0d0d;--ink:#fbe9c8;--soft:#d9b07a;--gold:#f0a82e;--card:#3a1414;--line:#6b3a22}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
main{width:100%;max-width:560px;padding:28px 18px}
.dharma{width:64px;height:64px;margin:0 auto 14px;color:var(--gold)}
h1{margin:0;font-size:clamp(30px,8vw,44px);line-height:1.25;font-weight:700}
.en{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(20px,5vw,26px);color:var(--soft);margin:4px 0 14px;font-weight:500}
.where{font-size:16px;line-height:1.6;color:var(--soft);margin:0 0 4px}
.date{font-weight:600;font-size:18px;margin:10px 0 26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.u{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 4px 12px}
.n{font-size:clamp(34px,10vw,54px);font-weight:700;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.l{margin-top:8px;font-size:14px;font-weight:600}
.l small{display:block;font-size:11px;font-weight:400;color:var(--soft)}
#done{display:none;font-size:clamp(26px,7vw,36px);font-weight:700;color:var(--gold);margin-top:10px}
.foot{margin-top:26px;font-size:14px;color:var(--soft);line-height:1.6}
</style>
</head>
<body>
<main>
<svg class="dharma" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="32" cy="32" r="26"/><circle cx="32" cy="32" r="6"/><path d="M32 6v20M32 38v20M6 32h20M38 32h20M13.6 13.6l14 14M36.4 36.4l14 14M50.4 13.6l-14 14M27.6 36.4l-14 14"/></svg>
<h1>কঠিন চীবর দান</h1>
<div class="en">Kathina Chibor Dan</div>
<p class="where">দুপচর তক্ষশীলা বৌদ্ধ বিহার<br>দুপচর, কুমিল্লা</p>
<p class="date">১৬ নভেম্বর ২০২৬ · 16 November 2026</p>
<div class="grid" id="grid" role="timer" aria-live="off">
<div class="u"><div class="n" id="d">০</div><div class="l">দিন<small>Days</small></div></div>
<div class="u"><div class="n" id="h">০</div><div class="l">ঘণ্টা<small>Hours</small></div></div>
<div class="u"><div class="n" id="m">০</div><div class="l">মিনিট<small>Minutes</small></div></div>
<div class="u"><div class="n" id="s">০</div><div class="l">সেকেন্ড<small>Seconds</small></div></div>
</div>
<div id="done">আজই সেই শুভ দিন! 🙏</div>
<p class="foot">সকলে সপরিবারে উপস্থিত থেকে পুণ্যের ভাগী হোন।<br>Everyone is warmly invited.</p>
</main>
<script>
(function(){
var target=new Date("2026-11-16T00:00:00+06:00").getTime();
var nf=new Intl.NumberFormat("bn-BD",{useGrouping:false});
function bn(x){return nf.format(x)}
function tick(){
var diff=target-Date.now();
if(diff<=0){document.getElementById("grid").style.display="none";document.getElementById("done").style.display="block";return;}
var s=Math.floor(diff/1000);
document.getElementById("d").textContent=bn(Math.floor(s/86400));
document.getElementById("h").textContent=bn(Math.floor(s%86400/3600));
document.getElementById("m").textContent=bn(Math.floor(s%3600/60));
document.getElementById("s").textContent=bn(s%60);
}
tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
